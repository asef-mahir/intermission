<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Intermission</title>
    <link rel="stylesheet" href="popup.css">
    <script src="storage.js" defer></script>
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main class="popup">
      <div class="popup-top">
        <div class="popup-header">
        <div class="brand-row">
          <img class="brand-logo" src="icons/icon48.png" alt="Intermission" width="22" height="22">
          <span class="status-indicator" id="status-indicator"></span>
          <p class="eyebrow">INTERMISSION</p>
        </div>
        <button class="lang-button" id="language-button" type="button"></button>
        </div>
        <h1 id="status"></h1>
      </div>

      <div class="actions-group">
        <button class="main-button" id="toggle-button" type="button"></button>
      </div>

      <div class="settings-divider"></div>

      <button class="settings-row" id="settings-button" type="button">
        <div class="settings-text">
          <strong id="settings-title"></strong>
          <span class="settings-desc" id="settings-desc"></span>
        </div>
        <span class="settings-arrow">→</span>
      </button>
    </main>
  </body>
</html>
